<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" font-family="Georgia, 'Times New Roman', serif">
  <title>Underwater Games: room connections</title>
  <desc>Relative layout of the studio's rooms and how they connect, with a corridor off the Main Room's right wall. A design reference; the game content is src/content/city/locations/studio.yaml.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a4b3a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b7a4b"/>
    </marker>
  </defs>

  <rect width="1000" height="900" fill="#f4eee0"/>
  <text x="500" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#2b2b2b">Underwater Games: room map</text>

  <!-- Below-ground band -->
  <rect x="290" y="728" width="260" height="150" rx="10" fill="#cfd9d6" stroke="#7d908c" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="302" y="750" font-size="14" font-style="italic" fill="#4b5d59">below ground (flooded)</text>

  <!-- Corridor -->
  <rect x="590" y="50" width="80" height="520" rx="6" fill="#d9d2bd" stroke="#2b2b2b" stroke-width="3"/>
  <text transform="translate(636 310) rotate(-90)" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">Corridor</text>

  <!-- Two-way connections (solid) -->
  <g stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="520" y1="465" x2="590" y2="465"/>
    <line x1="520" y1="305" x2="590" y2="305"/>
    <line x1="670" y1="100" x2="780" y2="100"/>
    <line x1="670" y1="205" x2="780" y2="205"/>
    <line x1="670" y1="310" x2="780" y2="310"/>
    <line x1="420" y1="760" x2="420" y2="700"/>
  </g>

  <!-- Door markers -->
  <g fill="#c98a2b" stroke="#2b2b2b" stroke-width="1.5">
    <rect x="547" y="457" width="12" height="16" rx="2"/>
    <rect x="547" y="297" width="12" height="16" rx="2"/>
    <rect x="719" y="92" width="12" height="16" rx="2"/>
    <rect x="719" y="197" width="12" height="16" rx="2"/>
    <rect x="719" y="302" width="12" height="16" rx="2"/>
    <rect x="412" y="723" width="16" height="12" rx="2"/>
  </g>

  <!-- Break Room: entered through a broken, zig-zag section of the corridor -->
  <polyline points="630,570 650,590 610,610 650,630 620,645 520,645" fill="none" stroke="#7a2e8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="535" y="672" font-size="13" font-style="italic" fill="#7a2e8a">impossible geometry</text>

  <!-- One-way, no way in yet (dashed arrows out of the secret rooms, into the corridor) -->
  <g stroke="#8a4b3a" stroke-width="3" fill="none" stroke-dasharray="9 7" stroke-linecap="round">
    <line x1="780" y1="415" x2="672" y2="415" marker-end="url(#arrow)"/>
    <line x1="780" y1="520" x2="672" y2="520" marker-end="url(#arrow)"/>
  </g>

  <!-- Rooms -->
  <g stroke="#2b2b2b" stroke-width="3">
    <rect x="320" y="260" width="200" height="90" rx="8" fill="#f2c96b"/>
    <rect x="320" y="420" width="200" height="90" rx="8" fill="#e8d9b5"/>
    <rect x="780" y="60" width="200" height="80" rx="8" fill="#e8d9b5"/>
    <rect x="780" y="165" width="200" height="80" rx="8" fill="#e8d9b5"/>
    <rect x="320" y="600" width="200" height="90" rx="8" fill="#e8d9b5"/>
    <rect x="320" y="760" width="200" height="90" rx="8" fill="#e8d9b5"/>
  </g>
  <g stroke="#2b2b2b" stroke-width="3" stroke-dasharray="3 7">
    <rect x="780" y="270" width="200" height="80" rx="8" fill="#e8d9b5"/>
  </g>
  <g stroke="#8a4b3a" stroke-width="3" stroke-dasharray="9 7" fill="#eadfd8">
    <rect x="780" y="375" width="200" height="80" rx="8"/>
    <rect x="780" y="480" width="200" height="80" rx="8"/>
  </g>

  <!-- Room labels -->
  <g text-anchor="middle" fill="#2b2b2b">
    <text x="420" y="299" font-size="21" font-weight="bold">Main Room</text>
    <text x="420" y="323" font-size="14">projects, blog</text>

    <text x="420" y="459" font-size="20" font-weight="bold">The Landing</text>
    <text x="420" y="483" font-size="14">herald, how the site works</text>

    <text x="880" y="96" font-size="20" font-weight="bold">Mail Room</text>
    <text x="880" y="118" font-size="14">contact, mailing list</text>

    <text x="880" y="201" font-size="20" font-weight="bold">Press Room</text>
    <text x="880" y="223" font-size="14">press kit (giant press)</text>

    <text x="880" y="306" font-size="20" font-weight="bold">Meeting Room</text>
    <text x="880" y="328" font-size="14">about us</text>

    <text x="880" y="411" font-size="20" font-weight="bold" fill="#8a4b3a">Waiting Room</text>
    <text x="880" y="433" font-size="14" fill="#8a4b3a">ticket machine, no way in yet</text>

    <text x="880" y="516" font-size="20" font-weight="bold" fill="#8a4b3a">Bathroom</text>
    <text x="880" y="538" font-size="14" fill="#8a4b3a">easter egg, no way in yet</text>

    <text x="420" y="639" font-size="20" font-weight="bold">Break Room</text>
    <text x="420" y="663" font-size="14">broken geometry</text>

    <text x="420" y="799" font-size="20" font-weight="bold">Archive</text>
    <text x="420" y="823" font-size="14">flooded, idea vault cabinet</text>
  </g>

  <!-- Door annotation -->
  <text x="555" y="445" text-anchor="middle" font-size="13" font-style="italic" fill="#2b2b2b">door beside the desk</text>

  <!-- Start marker -->
  <line x1="248" y1="465" x2="316" y2="465" stroke="#2b7a4b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="160" y="457" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b7a4b">visitors</text>
  <text x="160" y="477" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b7a4b">arrive here</text>

  <!-- Legend -->
  <g transform="translate(600 700)" font-size="14" fill="#2b2b2b">
    <rect x="-12" y="-24" width="390" height="190" rx="8" fill="#fffaf0" stroke="#bbb"/>
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
    <rect x="17" y="-6" width="16" height="12" rx="2" fill="#c98a2b" stroke="#2b2b2b" stroke-width="1.5"/>
    <text x="64" y="5">door, usable both ways</text>
    <polyline points="0,38 12,28 24,46 36,30 50,38" fill="none" stroke="#7a2e8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="43">broken section (Break Room entrance)</text>
    <line x1="0" y1="72" x2="50" y2="72" stroke="#8a4b3a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
    <text x="64" y="77">one way out only: no entrance yet</text>
    <rect x="0" y="96" width="50" height="20" rx="4" fill="#eadfd8" stroke="#8a4b3a" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="64" y="111">secret room (reached by the puzzle)</text>
    <rect x="0" y="130" width="50" height="20" rx="4" fill="#e8d9b5" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="3 7"/>

  </g>
</svg>
