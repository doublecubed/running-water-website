# The studio website's rooms. Every room is `exterior` on purpose: the
# interior/exterior distinction only drives the flat-rate hop rules from the
# old city sample, which the website doesn't want. Exits are plain
# connections (one per direction); a one-way connection is a one-way door.
#
# Layout: Landing -> Corridor -> (Main Room, Press, Mail, Meeting, Break).
# The Break Room leads down to the Archive. Waiting Room and Bathroom have no
# inbound connection yet (reserved for the puzzle). Every room's image ends
# with a full-width bottom strip hotspot that backs out to the previous room.
# See docs/website/site-map.md and room-map.svg.

- id: studio-landing
  kind: exterior
  aliases: [landing, the landing, entrance, lobby, reception]
  connections:
    - toId: studio-corridor
      distanceKm: 0.01
      modes: [foot]
  itemIds: [reception-desk]
  npcIds: [herald]
  x: 420
  'y': 465
  text:
    en:
      name: The Landing
      description: >-
        The entrance of Underwater Games: a beige wall, a reception desk with a
        monitor nobody is using, and a door leading to the corridor. A
        young man in very old-fashioned clothes stands by the desk, holding a
        scroll.
  image:
    src: studio-entrance.jpg
    text:
      en:
        alt: A beige reception area with a wooden door, a desk, and a page in medieval dress holding a scroll.
    hotspots:
      - text:
          en:
            label: Go through the door to the Corridor
        command: go to corridor
        rect: [5.3, 20.3, 20.2, 69.9]
      - text:
          en:
            label: Talk to the Landing Page
        command: talk herald
        rect: [74, 29, 18, 61]
      - text:
          en:
            label: Look at the reception desk
        command: examine reception desk
        rect: [30, 55, 42, 35]

- id: studio-mainroom
  kind: exterior
  aliases: [main room, studio, main]
  connections:
    - toId: studio-corridor
      distanceKm: 0.01
      modes: [foot]
  itemIds: [workspace, computer-desk, whiteboard]
  x: 420
  'y': 305
  text:
    en:
      name: Main Room
      description: >-
        This is the main room of Underwater Games. It's funny, because nothing
        is under water here. You see two desks ahead, one with a computer and
        one with a clutter of papers on it. To the left is a whiteboard in front
        of a window. A door on the right leads out to the corridor, the way you
        came in.
  image:
    src: studio-general.jpg
    text:
      en:
        alt: An indie game studio like no other.
    hotspots:
      - text:
          en:
            label: Workspace
        command: examine workspace
        rect: [62.08, 60.85, 21.81, 15.93]
      - text:
          en:
            label: Computer desk
        command: examine computer desk
        rect: [41, 44.18, 20.72, 22.62]
      - text:
          en:
            label: Whiteboard
        command: examine whiteboard
        rect: [5.39, 25.78, 21.57, 33.56]
      - text:
          en:
            label: Out to the corridor
        command: go to corridor
        rect: [86, 0, 14, 90]
      - text:
          en:
            label: Back to the Corridor
        command: go to corridor
        rect: [0, 90, 100, 10]

- id: studio-corridor
  kind: exterior
  aliases: [corridor, hallway, hall]
  connections:
    - toId: studio-landing
      distanceKm: 0.01
      modes: [foot]
    - toId: studio-mainroom
      distanceKm: 0.01
      modes: [foot]
    - toId: studio-pressroom
      distanceKm: 0.01
      modes: [foot]
    - toId: studio-mailroom
      distanceKm: 0.01
      modes: [foot]
    - toId: studio-meetingroom
      distanceKm: 0.01
      modes: [foot]
    - toId: studio-breakroom
      distanceKm: 0.01
      modes: [foot]
  x: 630
  'y': 310
  text:
    en:
      name: Corridor
      description: >-
        A long beige corridor with a green tiled floor and doors on both sides.
        Behind you is the door to the landing. On the left, an open doorway leads to the main room, and a door
        further along leads to the meeting room. The press room and the mail room
        are on the right. At the far end is a door that does not quite belong
        to the building. It leads to the break room.
  image:
    src: studio-corridor.jpg
    text:
      en:
        alt: A long corridor with a green tiled floor, doors along both walls, and an open doorway on the left showing the main room.
    hotspots:
      - text:
          en:
            label: Back to the Main Room
        command: go to main room
        rect: [5.5, 0, 28, 90]
      - text:
          en:
            label: Meeting Room
        command: go to meeting room
        rect: [43.6, 28, 5.1, 45.6]
      - text:
          en:
            label: Press Room
        command: go to press room
        rect: [71, 30, 3, 38]
      - text:
          en:
            label: Break Room
        command: go to break room
        rect: [59, 41, 3.6, 12.5]
      - text:
          en:
            label: Mail Room
        command: go to mail room
        rect: [81, 9, 9.5, 81]
      - text:
          en:
            label: Back to the Landing
        command: go to landing
        rect: [0, 90, 100, 10]

- id: studio-pressroom
  kind: exterior
  aliases: [press room, press]
  connections:
    - toId: studio-corridor
      distanceKm: 0.01
      modes: [foot]
  x: 880
  'y': 205
  text:
    en:
      name: Press Room
      description: >-
        A very large printing press has been installed in a very small room.
        There is no press kit here. There probably never will be.
  image:
    src: studio-pressroom.jpg
    text:
      en:
        alt: A huge printing press crammed into a small room.
    hotspots:
      - text:
          en:
            label: Back to the Corridor
        command: go to corridor
        rect: [0, 90, 100, 10]

- id: studio-meetingroom
  kind: exterior
  aliases: [meeting room, meeting, conference room]
  connections:
    - toId: studio-corridor
      distanceKm: 0.01
      modes: [foot]
  x: 880
  'y': 310
  text:
    en:
      name: Meeting Room
      description: >-
        A long table, mismatched chairs and a whiteboard that says Q3 Goals.
        This is where the studio meets, and where you can meet the studio. One
        of the chairs has a crayon drawing of its owner taped to the back.
  image:
    src: studio-meetingroom.jpg
    text:
      en:
        alt: A meeting room with a long table, office chairs, a window onto the city, and a whiteboard reading Q3 Goals.
    hotspots:
      - text:
          en:
            label: Back to the Corridor
        command: go to corridor
        rect: [0, 90, 100, 10]

- id: studio-mailroom
  kind: exterior
  aliases: [mail room, mail, post room]
  connections:
    - toId: studio-corridor
      distanceKm: 0.01
      modes: [foot]
  x: 880
  'y': 100
  text:
    en:
      name: Mail Room
      description: >-
        Rows of empty pigeonholes surround a vast mail-sorting machine. Something
        with too many arms is operating it from the inside. There is no mail,
        because this is an indie studio.
  image:
    src: studio-mailroom.jpg
    text:
      en:
        alt: A mail room full of pigeonholes, with a sorting machine operated by a creature with several arms.
    hotspots:
      - text:
          en:
            label: Back to the Corridor
        command: go to corridor
        rect: [0, 90, 100, 10]

- id: studio-breakroom
  kind: exterior
  aliases: [break room, break]
  connections:
    - toId: studio-corridor
      distanceKm: 0.01
      modes: [foot]
    - toId: studio-archive
      distanceKm: 0.01
      modes: [foot]
  x: 420
  'y': 645
  text:
    en:
      name: Break Room
      description: >-
        A break room that is, frankly, broken. The staircase appears to come out
        of the ceiling twice, and one corner of the floor is a wall. You got
        here through a part of the corridor that should not exist. A doorway
        leads down to the archive.
  image:
    src: studio-breakroom.jpg
    text:
      en:
        alt: A messy break room where the geometry has stopped agreeing with itself.
    hotspots:
      - text:
          en:
            label: Down the stairs to the Archive
        command: go to archive
        rect: [47, 38, 8, 33]
      - text:
          en:
            label: Back to the Corridor
        command: go to corridor
        rect: [0, 90, 100, 10]

- id: studio-archive
  kind: exterior
  aliases: [archive, the archive, basement]
  connections:
    - toId: studio-breakroom
      distanceKm: 0.01
      modes: [foot]
  itemIds: [cabinet]
  x: 420
  'y': 805
  text:
    en:
      name: Archive
      description: >-
        A flooded basement full of drifting paperwork. Tentacles surface now and
        then and sink again. A tall cabinet stands in the water, and a wooden
        stair leads back up.
  image:
    src: studio-archive.jpg
    text:
      en:
        alt: A flooded basement archive with floating papers, a wardrobe, and tentacles in the water.
    hotspots:
      - text:
          en:
            label: Look at the cabinet
        command: examine cabinet
        rect: [56, 21, 16, 40]
      - text:
          en:
            label: Up the stairs to the Break Room
        command: go to break room
        rect: [73, 5, 24, 60]
      - text:
          en:
            label: Back up to the Break Room
        command: go to break room
        rect: [0, 90, 100, 10]

