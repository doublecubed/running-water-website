labels:
  - id: street
    text:
      en:
        name: the street
  - id: official
    text:
      en:
        name: the law
  - id: worker
    text:
      en:
        name: the working folk
facts:
  - id: courier
    text:
      en: A courier in a grey coat dropped the ledger in the alley Tuesday night.
npcs:
  - id: informant
    aliases:
      - informant
      - man
      - stranger
    locationId: alley
    labels:
      - street
    dialogueRules:
      - when:
          all:
            - memory:
                verb: took
                subject: player
                object: object:ledger
            - npcStat: suspicion
              op: <
              value: 2
        effects:
          - suspicion: 2
          - trust: -1
        text:
          en: >-
            "{npcKey}" stares at your coat pocket. "That ledger was not yours to
            lift. I saw you." His voice drops. "Keep walking."
      - when:
          npcStat: suspicion
          op: '>='
          value: 2
        text:
          en: '"{npcKey}" turns his back to you and says nothing at all.'
    text:
      en:
        name: the informant
        description: A nervous man in a long coat who keeps glancing over his shoulder.
        dialogue: >-
          "{npcKey}" mutters that a ledger went missing from the gazette stand.
          "Try the diner. Rosa sees everyone who comes through. Sweet-talk the
          law first, she trusts the ones the law trusts."
  - id: officer-hale
    aliases:
      - hale
      - officer
      - officer hale
      - cop
    locationId: precinct
    labels:
      - official
    schedule:
      - fromHour: 8
        toHour: 18
        locationId: precinct
      - fromHour: 18
        toHour: 24
        locationId: diner
    dialogueRules:
      - when:
          all:
            - playerKnows: courier
            - not:
                flag: case.ledger.solved
        effects:
          - setFlag: case.ledger.solved
        text:
          en: >-
            "{npcKey}" listens, then closes his notebook. "A courier, dropping
            it in the alley. That squares with the rest. Good work. Consider the
            ledger closed."
      - when:
          flag: case.ledger.solved
        text:
          en: >-
            "{npcKey}" tips his cap. "Ledger is closed. Nothing more for you
            here."
      - when:
          not:
            flag: talkedTo.officer-hale
        effects:
          - reputation:
              scope: worker
              delta: 1
        text:
          en: >-
            "{npcKey}" looks you over. "Detective, is it. Rosa at the diner
            keeps her ear to the floor. Tell her I sent you. I'll put in a good
            word."
    text:
      en:
        name: Officer Haley
        description: A heavyset patrolman with a notebook he never seems to write in.
        dialogue: >-
          "{npcKey}" nods. "Ledger's gone missing, I hear. Find out who left it
          in that alley and bring it to me."
  - id: cook-rosa
    aliases:
      - rosa
      - cook
    locationId: diner
    labels:
      - worker
    dialogueRules:
      - when:
          not:
            flag: talkedTo.cook-rosa
        effects:
          - trust: 1
        text:
          en: >-
            "{npcKey}" studies you a moment. "Coffee's on the counter. Come back
            when you've got more than questions."
    topics:
      - id: ledger
        text:
          en:
            label: the ledger
            dialogue: '"{npcKey}" shakes her head. "Not yet. Come back when I know you."'
        responses:
          - when:
              npcStat: opinionOfPlayer
              op: '>='
              value: 2
            effects:
              - learnFact: courier
            text:
              en: >-
                "{npcKey}" lowers her voice. "Fine. A courier in a grey coat
                came through the alley Tuesday night and left a ledger by the
                streetlamp. He caught the last bus. Now you know what I know."
      - id: herself
        text:
          en:
            label: Rosa
            dialogue: >-
              "{npcKey}" shrugs. "Twenty years behind this counter. I see
              everything that comes through that door, and forget most of it —
              on purpose."
    text:
      en:
        name: Rosa
        description: >-
          A broad-shouldered cook wiping her hands on a dish towel, watching the
          door.
        dialogue: >-
          "{npcKey}" keeps her eyes on the grill. "Don't know you. Don't know
          anything."
