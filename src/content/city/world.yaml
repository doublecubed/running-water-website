labels: []
facts: []
npcs:
  - id: herald
    aliases: [herald, landing page, page, the page, man, boy]
    locationId: studio-landing
    labels: []
    dialogueRules:
      - when:
          not:
            flag: talkedTo.herald
        text:
          en: >-
            {npcKey} bows so deeply his feathered cap nearly falls off. "Hail,
            traveller! I am the Landing Page. It is my duty to greet all who
            arrive. This is a game, and also a website. You may click on things,
            or type commands such as 'examine', 'talk' and 'go to'. Ask me about
            the studio, or go through the door to see for yourself."
    topics:
      - id: studio
        text:
          en:
            label: the studio
            dialogue: >-
              {npcKey} unrolls the scroll. "Underwater Games is a small studio.
              Nothing here is under water, which we consider a clever name. The
              main room beyond that door is where the work happens."
      - id: site
        text:
          en:
            label: how this works
            dialogue: >-
              {npcKey} clears his throat. "Doors and clickable things lead you
              from room to room. Type 'examine' and the name of something to
              look closer, 'talk' to speak to someone, 'back' to stop looking.
              Click the locations list to walk to a place you have already
              visited."
    text:
      en:
        name: Landing Page
        description: >-
          A young man in a feathered cap and a red-and-gold doublet, as if he had
          been cut out of a tarot card. He holds a scroll and looks eager to help.
        dialogue: >-
          {npcKey} bows. "Hail again! Ask me anything, or step through the door to
          the main room."
