- id: case-file
  kind: item
  portable: true
  aliases:
    - case file
    - file
    - case-file
  text:
    en:
      name: case file
      description: >-
        A thin folder of notes on the Hollow Street disappearance. Someone underlined
        a name in red.
- id: desk
  kind: setpiece
  portable: false
  aliases:
    - desk
    - writing desk
  text:
    en:
      name: the writing desk
      description: A battered oak desk, scarred with cigarette burns.
  # Placeholder art — shown in the image pane while the desk is examined
  # (a part state's own image below overrides it). See docs/systems/image-pane.md.
  image:
    src: desk.svg
    text:
      en:
        alt: A battered oak desk seen from the front.
    hotspots:
      - text:
          en:
            label: Look at the right drawer
        command: examine right drawer
        rect: [55, 45, 30, 40]
  parts:
    - id: left-drawer
      aliases:
        - left drawer
      defaultStateId: closed
      text:
        en:
          name: the left drawer
          description: A small drawer, its brass handle tarnished green.
      states:
        - id: closed
          enterAliases:
            - close
          text:
            en:
              name: closed
              description: The left drawer is closed.
        - id: open
          enterAliases:
            - open
          text:
            en:
              name: open
              description: The left drawer is open — empty, save for a few paper clips.
    - id: right-drawer
      aliases:
        - right drawer
        - drawer
      defaultStateId: open
      text:
        en:
          name: the right drawer
          description: A wider drawer, its lock long since broken.
      states:
        - id: closed
          enterAliases:
            - close
          text:
            en:
              name: closed
              description: The right drawer is closed.
          image:
            src: desk-drawer-closed.svg
            text:
              en:
                alt: The desk, its right drawer shut.
            hotspots:
              - text:
                  en:
                    label: Open the right drawer
                command: open right drawer
                rect: [55, 45, 30, 40]
        - id: open
          important: true
          exposesContents: true
          enterAliases:
            - open
          text:
            en:
              name: open
              description: >-
                The right drawer is open, revealing a torn photograph tucked under some old
                receipts.
              summary: One of its drawers is open.
          image:
            src: desk-drawer-open.svg
            text:
              en:
                alt: The desk, its right drawer open on a torn photograph.
            hotspots:
              - text:
                  en:
                    label: Take the torn photograph
                command: take torn photograph
                rect: [58, 50, 24, 20]
              - text:
                  en:
                    label: Close the right drawer
                command: close right drawer
                rect: [55, 78, 30, 12]
- id: torn-photograph
  kind: item
  portable: true
  aliases:
    - torn photograph
    - photograph
    - photo
  containerId: desk
  containerPartId: right-drawer
  text:
    en:
      name: the torn photograph
      description: >-
        Half of a photograph, the other half torn away. Two people stand in front of
        a building that could be the Grand Hotel.
